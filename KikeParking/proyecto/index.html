<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login y Registro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="logo-container">
            <img src="assets/logo.png" alt="Logo Kike Parking" class="logo">
        </div>

        <div class="switch">
            <button id="btnLogin" onclick="showLogin()">Iniciar Sesión</button>
            <button id="btnRegister" onclick="showRegister()">Registrarse</button>
        </div>

        <!-- LOGIN -->
        <div id="loginForm" class="formulario">
            <h2>¡Bienvenido de vuelta!</h2>

            <form onsubmit="iniciarSesion(event)">
                <div class="grupo-input">
                    <label for="loginCorreo">Correo electrónico</label>
                    <input type="email" id="loginCorreo" placeholder="ejemplo@correo.com" required>
                </div>
                <div class="grupo-input">
                    <label for="loginPassword">Contraseña</label>
                    <input type="password" id="loginPassword" placeholder="Tu contraseña" required>
                </div>

                <button type="submit" class="btn-primario">Ingresar</button>
            </form>
        </div>

        <!-- REGISTRO -->
        <div id="registerForm" class="formulario hidden">
            <h2>Crea tu cuenta</h2>

            <form onsubmit="registrarUsuario(event)">
                <div class="grupo-input">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" placeholder="Ej. Manuela Castaño" required>
                </div>

                <div class="grupo-input">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Crea una contraseña" required>
                </div>

                 <div class="grupo-input">
                    <label for="confirmPassword">Confirmar contraseña</label>
                    <input type="password" id="confirmPassword" placeholder="Confirma tu contraseña" required>
                </div>

                    <div class="grupo-input">
                        <label for="rol">¿Cómo usarás Kike Parking?</label>
                        <select id="rol" required>
                            <option value="">Seleccione una opción...</option>
                            <option value="conductor">Quiero parquear mi vehículo</option>
                            <option value="propietario">Tengo un espacio para alquilar</option>
                        </select>
                    </div>

                    <button type="submit" class="btn-primario">Registrarse</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
